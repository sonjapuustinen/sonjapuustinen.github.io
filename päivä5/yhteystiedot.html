<!DOCTYPE html>
<html lang="fi">
<head>  
  <meta charset="utf-8">
  <title>Yhteystietolomake</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="tyyli.css"> 
</head>

<body>
  <div class="container">
    <h2><b>Yhteystieto lomake</b></h2>
    <form action="yhteystiedot.php" method="post"> 
      <div class="form-group">
        <label for="name">Nimi</label>
        <input type="text" class="form-control" id="name" name="name" placeholder="Syötä nimesi" tabindex="1" required>
      </div>

      <div class="form-group">
        <label for="email">Sähköposti</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Syötä sähkoposti" tabindex="2" required>
      </div>

      <div class="form-group">
        <label for="message">Viesti</label>
        <textarea id="message" class="form-control" name="message" rows="4" placeholder="Kirjoita tähän viestisi" tabindex="3" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary button-space" tabindex="4">Lähetä</button>
      <button type="reset" class="btn btn-secondary" tabindex="5">Tyhjennä</button>
    </form>
  </div>
</body>
</html>
